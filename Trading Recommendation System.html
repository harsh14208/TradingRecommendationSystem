<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#10b981"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Signal.Trade"/>
<link rel="manifest" href="/manifest.json"/>
<title>Signal.Trade — Trading Recommendation System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css?v=3"/>
</head>
<body>
<div id="root"></div>

<!--
  init.js: service worker registration + PWA install prompt handler.
  Kept external (not inline) so CSP can use script-src 'self' without 'unsafe-inline'.
-->
<script src="/init.js"></script>

<!-- CDN: React 18.3.1 UMD (global window.React / window.ReactDOM) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<!-- CDN: lightweight-charts (global window.LightweightCharts) -->
<script src="https://unpkg.com/lightweight-charts@4/dist/lightweight-charts.standalone.production.js" crossorigin="anonymous"></script>

<!-- Static data (sector ETFs, ticker metadata — loaded synchronously before app) -->
<script src="/data.js"></script>

<!--
  App loading — two paths, selected at runtime:

  PATH A — Production: dist/app-bundle.js (esbuild pre-compiled, minified, no eval)
    Build: npm install && npm run build     (see build.mjs)
    After first build: remove 'unsafe-eval' from CSP in backend/main.py _SCRIPT_SRC.
    TTI: <500 ms. Babel CDN (~900 KB) eliminated.

  PATH B — Dev fallback: Babel standalone + individual JSX files (auto-activates when
    dist/app-bundle.js returns 404, i.e. build not yet run).
    Requires 'unsafe-eval' in CSP (Babel uses new Function() for JSX transform).
    TTI: 2-5 s. XSS surface: type="text/babel" is eval-equivalent.

  No JSX file changes required to switch between paths.
-->
<!-- load-app.js: selects bundle (prod) vs Babel CDN (dev) — external to satisfy CSP -->
<script src="/load-app.js"></script>

<!--
  JSX files: only processed when Babel CDN loads (Path B).
  When Path A (bundle) succeeds, Babel is never loaded so these are ignored
  by the browser (unknown type="text/babel" is a no-op without Babel).
-->
<script type="text/babel" src="/app.auth.jsx?v=20260528"></script>
<script type="text/babel" src="/app.constants.jsx?v=20260528"></script>
<script type="text/babel" src="/app.ui.jsx?v=20260528"></script>
<script type="text/babel" src="/app.signal.jsx?v=20260528"></script>
<script type="text/babel" src="/app.views.jsx?v=20260528"></script>
<script type="text/babel" src="/app.modals.jsx?v=20260528"></script>
<script type="text/babel" src="/app.analysis.jsx?v=20260528"></script>
<script type="text/babel" src="/app.jsx?v=20260528"></script>
</body>
</html>
