app = "signal-trade"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Keep at least 1 machine running for trading uptime (avoid cold-start latency).
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# /app/data holds both trading.db (database) and factor_weights.json
# ⚠️  WARNING: SQLite on a Fly.io volume causes split-brain if you scale to more
# than one machine (each machine would see a *different* local SQLite file).
# For multi-machine deployments, use PostgreSQL via Fly Postgres or Supabase
# and remove this mount.
[[mounts]]
  source = "signal_trade_data"
  destination = "/app/data"
