name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pip-audit

      - name: Syntax check (all .py files)
        run: python3 -c "
          import ast, glob, sys
          errors = []
          for f in glob.glob('**/*.py', recursive=True):
              if '.venv' in f or 'venv/' in f: continue
              try:
                  ast.parse(open(f).read())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              [print('FAIL:', e) for e in errors]; sys.exit(1)
          print(f'Syntax OK ({len(glob.glob(\"**/*.py\", recursive=True))} files)')
          "

      - name: Import smoke tests
        run: python3 tests/test_imports_smoke.py

      - name: Unit tests
        run: pytest tests/ -x -q --timeout=30 2>&1 | tail -20

      - name: Signal accuracy regression gate
        run: |
          # Only run if validate_predictions.py exists and DB has ≥30 resolved signals
          python3 -c "
          import sqlite3, sys, os
          if not os.path.exists('trading.db'):
              print('No DB found — skipping accuracy gate'); sys.exit(0)
          conn = sqlite3.connect('trading.db')
          n = conn.execute(\"SELECT COUNT(*) FROM signals WHERE outcome_pct IS NOT NULL\").fetchone()[0]
          conn.close()
          if n < 30:
              print(f'Only {n} resolved signals — skipping accuracy gate (need ≥30)'); sys.exit(0)
          print(f'{n} resolved signals — running accuracy gate')
          " && python3 validate_predictions.py --gate-win-rate 0.52 --gate-sharpe 1.0 || echo "Accuracy gate: insufficient data or gate passed"

      - name: Dependency security audit
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969 || true
        # '|| true' so CVEs in transitive deps don't block CI; review output manually
