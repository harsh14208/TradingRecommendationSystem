name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    # R10-18: a real PostgreSQL service so the true-E2E test in
    # tests/test_postgres_e2e.py actually runs (it auto-skips when
    # TEST_POSTGRES_URL is unset). The rest of the suite still uses SQLite
    # via the DISC-5 guard / conftest — this URL is read only by that test.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history for secrets scan

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout pip-audit ruff

      - name: Build frontend bundles
        working-directory: ${{ github.workspace }}
        run: |
          npm install
          npm run build

      - name: Syntax check (all .py files)
        run: |
          python3 - <<'PYEOF'
          import ast, glob, sys
          errors = []
          for f in glob.glob('**/*.py', recursive=True):
              if '.venv' in f or 'venv/' in f: continue
              try:
                  ast.parse(open(f).read())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              [print('FAIL:', e) for e in errors]; sys.exit(1)
          print(f'Syntax OK ({len(glob.glob("**/*.py", recursive=True))} files)')
          PYEOF

      - name: Ruff lint
        run: ruff check . --config ../ruff.toml

      - name: Import smoke tests
        run: python3 tests/test_imports_smoke.py

      - name: Unit tests with coverage
        run: |
          pytest tests/ -x -q --timeout=30 \
            --cov=. --cov-report=term-missing --cov-report=xml

      - name: Coverage floor (25%)
        run: |
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET, sys
          # Floor is 25%: realistic for a codebase with many external-service paths
          # (signal_engine.py 7k+ lines, polygon_client, yfinance, Stripe are mocked in tests).
          # Key coverage targets: routers/auth (46%), routers/billing (40%), signal_ml (37%).
          # Raise toward 40% once more unit tests cover broker_svc.py and admin.py endpoints.
          try:
              tree = ET.parse('coverage.xml')
              rate = float(tree.getroot().attrib.get('line-rate', 0)) * 100
              print(f'Coverage: {rate:.1f}%')
              if rate < 25:
                  print(f'FAIL: coverage {rate:.1f}% < 25% floor')
                  sys.exit(1)
              print('PASS')
          except FileNotFoundError:
              print('coverage.xml not found — skipping floor check')
          PYEOF

      - name: Signal accuracy regression gate
        run: |
          # Only run if validate_predictions.py exists and DB has ≥30 resolved signals
          if [ ! -f trading.db ]; then
            echo "No DB found — skipping accuracy gate"
            exit 0
          fi
          resolved=$(python3 -c "import sqlite3; conn = sqlite3.connect('trading.db'); print(conn.execute('SELECT COUNT(*) FROM signals WHERE outcome_pct IS NOT NULL').fetchone()[0]); conn.close()")
          if [ "$resolved" -lt 30 ]; then
            echo "Only $resolved resolved signals — skipping accuracy gate (need ≥30)"
            exit 0
          fi
          echo "$resolved resolved signals — running accuracy gate"
          python3 validate_predictions.py --gate-win-rate 0.52 --gate-sharpe 1.0

      - name: Dependency security audit
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969

      - name: Frontend npm audit
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high --omit=dev
            echo "npm audit complete (high+ only; dev deps excluded)"
          else
            echo "No package.json found — skipping npm audit"
          fi

  lighthouse:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Build frontend bundles
        run: |
          npm install
          npm run build

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Start backend and run Lighthouse CI
        env:
          SIGNAL_TRADE_TESTING: "1"
          DATABASE_URL: sqlite+aiosqlite:///./data/trading_lh_ci.db
          JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
          OWNER_EMAIL: owner@example.com
          OWNER_PASSWORD: ci-ci-ci-ci-ci-ci-ci
          APP_URL: http://localhost:8000
          SITE_PRIVATE_TOKEN: ""
          SENTRY_DSN: ""
          REDIS_URL: ""
          ALPACA_API_KEY: ""
          POLYGON_API_KEY: ""
          MASSIVE_API_KEY: ""
          TELEGRAM_BOT_TOKEN: ""
          SMTP_HOST: ""
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          rm -f backend/data/trading_lh_ci.db*
          (cd backend && exec python3 -m uvicorn main:app --host 127.0.0.1 --port 8000 --log-level warning) > /tmp/uvicorn.log 2>&1 &
          UVICORN_PID=$!
          for i in {1..30}; do
            curl -sf http://localhost:8000/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/health >/dev/null || { echo "Backend failed to start"; cat /tmp/uvicorn.log; kill $UVICORN_PID; exit 1; }
          curl -s -c /tmp/cookies.txt -b /tmp/cookies.txt -X POST http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"owner@example.com","password":"ci-ci-ci-ci-ci-ci-ci"}' \
            -o /tmp/login.json
          export ST_REFRESH=$(grep 'st_refresh' /tmp/cookies.txt | awk '{printf $7}')
          if [ -z "$ST_REFRESH" ]; then
            echo "Failed to obtain refresh cookie"
            cat /tmp/login.json
            cat /tmp/uvicorn.log
            kill $UVICORN_PID
            exit 1
          fi
          ./node_modules/.bin/lhci autorun
          LH_EXIT=$?
          kill $UVICORN_PID
          wait $UVICORN_PID 2>/dev/null || true
          exit $LH_EXIT

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # optional: only needed for org scans
        # 2026-06-18: removed continue-on-error: true — secrets must block the build
        # until gitleaks baseline is clean.

  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Railway
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: |
          npm install -g @railway/cli
          railway up --service signal-trade --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # 2026-06-18: removed continue-on-error — a failed deploy should be visible

      - name: Deploy to Fly.io (fallback)
        if: ${{ env.FLY_API_TOKEN != '' && env.RAILWAY_TOKEN == '' }}
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest

      - name: Fly deploy
        if: ${{ env.FLY_API_TOKEN != '' && env.RAILWAY_TOKEN == '' }}
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # 2026-06-18: removed continue-on-error — a failed deploy should be visible
