<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Signal.Trade — Institutional-Grade Trading Signals</title>
<meta name="description" content="Institutional-grade trading signals: 65+ signal blocks, Polygon.io primary data, dark pool reconstruction, Macro HMM regime model. 58.2% 7-day win rate · Sharpe 1.97. Start free."/>
<meta property="og:title" content="Signal.Trade — Institutional-Grade Trading Signals"/>
<meta property="og:description" content="65+ signal blocks fused into one confidence score (max 84%). Polygon.io primary data, dark pool prints, 13F institutional flow. 164-ticker watchlist. Free trial."/>
<meta property="og:type" content="website"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/site.css"/>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ overflow-x:hidden; }
  #root{ min-height:100vh; }
</style>
</head>
<body>
<div id="root"></div>
<!--
  PATH A (production): compiled bundle — no Babel, no unsafe-eval, ~80ms TTI.
    Build: npm install && npm run build  →  dist/site-bundle.js
  PATH B (dev fallback): Babel standalone — auto-activates when bundle absent.
    Requires 'unsafe-eval' in CSP. TTI: 2-5 s. XSS surface: text/babel is eval-equivalent.
    Only suitable for localhost development.
-->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="/dist/site-bundle.js" id="site-bundle"></script>
<script>
(function () {
  var bundle = document.getElementById('site-bundle');
  if (!bundle || !window.React) {
    // Bundle absent (not yet built) — fall back to Babel for local dev only.
    if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      console.error('[Signal.Trade] dist/site-bundle.js missing. Run: npm install && npm run build');
      return;
    }
    var babelScript = document.createElement('script');
    babelScript.src = 'https://unpkg.com/@babel/standalone@7.29.0/babel.min.js';
    babelScript.onload = function () {
      console.warn('[Signal.Trade] Babel fallback active — run npm run build for production.');
      var s = document.createElement('script');
      s.type = 'text/babel';
      s.src = '/site.jsx';
      document.body.appendChild(s);
      if (window.Babel) Babel.transformScriptTags();
    };
    document.body.appendChild(babelScript);
  }
})();
</script>
</body>
</html>
