repos:
  # ── Ruff: lint + format (replaces flake8 + isort + black) ──────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 0c7b6c989466a93942def1f84baf36ddfcd60c83  # frozen: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ── Trailing whitespace / end-of-file ──────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # NOTE: pip-audit removed from pre-commit because it re-installs requirements
  # against the system Python (3.14) and fails building scipy from source.
  # Run manually in .venv311 when requirements change:
  #   cd backend && ../.venv311/bin/pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969
