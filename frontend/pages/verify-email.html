<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="/favicon.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Verify Email — Signal.Trade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg1:#161b22;--bg2:#1c2128;
  --line:#21262d;--line2:#30363d;
  --text:#e6edf3;--dim:#8b949e;--faint:#484f58;
  --up:#10b981;--down:#ef4444;--warn:#f59e0b;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',-apple-system,sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
.page-nav{position:fixed;top:0;left:0;right:0;background:rgba(13,17,23,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:12px 32px}
.nav-logo{text-decoration:none;display:inline-flex;align-items:center}
.nav-logo img{height:90px;width:auto;display:block}
.card{background:var(--bg1);border:1px solid var(--line);border-radius:16px;padding:40px 36px;max-width:440px;width:100%;text-align:center}
.icon{font-size:52px;margin-bottom:20px}
h2{font-size:24px;font-weight:800;letter-spacing:-0.03em;margin-bottom:10px}
p{font-size:14px;color:var(--dim);line-height:1.7;margin-bottom:16px}
.btn{display:block;width:100%;padding:14px;background:var(--up);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);text-decoration:none;text-align:center;margin-top:8px;transition:background .15s}
.btn:hover{background:#059669}
.btn.secondary{background:var(--bg2);border:1px solid var(--line2);color:var(--text)}
.btn.secondary:hover{border-color:var(--text)}
.error{color:var(--down)}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--up);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<nav class="page-nav">
  <a href="/" class="nav-logo"><img src="/logo-full.png" alt="Signal.Trade"/></a>
</nav>

<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <h2 id="title">Verifying your email…</h2>
  <p id="message">Please wait a moment.</p>
</div>

<script src="/verify-email.js"></script>
</body>
</html>
