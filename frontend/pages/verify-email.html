<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="icon" type="image/png" href="/favicon.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0a0f1a"/>
<meta name="msapplication-TileColor" content="#0a0f1a"/>
<title>Verify Email — Signal.Trade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1a;--bg-0:#0a0f1a;--bg-1:#0e1420;--bg-2:#131a28;--bg1:#0e1420;--bg2:#131a28;
  --line:#1f2a3d;--line2:#273348;--line-soft:rgba(255,255,255,0.04);
  --text:#e6edf7;--dim:#8a97ad;--faint:#7f8d9e;
  --up:#22d3ee;--down:#fb4d6d;--warn:#fbbf24;--accent:#22d3ee;--purple:#7c3aed;
  --up-soft:rgba(34,211,238,.12);--down-soft:rgba(251,77,109,.12);--warn-soft:rgba(251,191,36,.12);
  --panel:rgba(255,255,255,.025);--panel-2:rgba(255,255,255,.045);
  --ease:cubic-bezier(0.22,1,0.36,1);
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',-apple-system,sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
.page-nav{position:fixed;top:0;left:0;right:0;background:rgba(13,17,23,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:12px 32px}
.nav-logo{text-decoration:none;display:inline-flex;align-items:center}
.nav-logo img{height:90px;width:auto;display:block}
.card{background:var(--panel);border:1px solid var(--line-soft);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:40px 36px;max-width:440px;width:100%;text-align:center}
.icon{font-size:52px;margin-bottom:20px}
h2{font-size:24px;font-weight:800;letter-spacing:-0.03em;margin-bottom:10px}
p{font-size:14px;color:var(--dim);line-height:1.7;margin-bottom:16px}
.btn{display:block;width:100%;padding:14px;background:var(--up);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);text-decoration:none;text-align:center;margin-top:8px;transition:background .15s}
.btn:hover{background:#3ee0f8}
.btn.secondary{background:var(--bg2);border:1px solid var(--line2);color:var(--text)}
.btn.secondary:hover{border-color:var(--text)}
.error{color:var(--down)}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--up);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--panel);border:1px solid var(--line-soft);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:10px}
.glass-hover{transition:transform .25s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease)}
.glass-hover:hover{transform:translateY(-2px);background:var(--panel-2);border-color:rgba(34,211,238,.22);box-shadow:0 0 0 1px rgba(34,211,238,.08),0 12px 32px -16px rgba(0,0,0,.8)}

</style>
</head>
<body>
<nav class="page-nav">
  <a href="/" class="nav-logo"><img src="/logo-full.svg" alt="Signal.Trade"/></a>
</nav>

<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <h2 id="title">Verifying your email…</h2>
  <p id="message">Please wait a moment.</p>
</div>

<script src="/verify-email.js"></script>
</body>
</html>
