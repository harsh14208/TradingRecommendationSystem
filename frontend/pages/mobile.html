<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0f1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Signal.Trade"/>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="manifest" href="/manifest.json"/>
<title>Signal.Trade</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/src/mobile.css"/>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body,#root{ height:100%; overflow:hidden; background:#0a0f1a; }
  body{ -webkit-font-smoothing:antialiased; }
</style>
</head>
<body>
<div id="root"></div>
<!-- A8 migration complete 2026-05-31: esbuild bundle replaces Babel CDN -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="/dist/mobile-bundle.js" onerror="
  var h=document.hostname||location.hostname;
  if(h==='localhost'||h==='127.0.0.1'){
    var b=document.createElement('script');
    b.src='https://unpkg.com/@babel/standalone@7.29.0/babel.min.js';
    b.onload=function(){Babel.transformScriptTags();};
    document.body.appendChild(b);
    var s=document.createElement('script');
    s.type='text/babel';s.src='/mobile.jsx';
    document.body.appendChild(s);
  } else {
    var d=document.createElement('div');
    d.textContent='Bundle missing. Run node build.mjs.';
    d.style.cssText='padding:2rem;color:var(--down);font-family:monospace';
    document.body.appendChild(d);
  }
"></script>
</body>
</html>
