<body>
<main id="root"></main>

<!--
  init.js: service worker registration + PWA install prompt handler.
  Kept external (not inline) so CSP can use script-src 'self' without 'unsafe-inline'.
-->
<script src="/init.js"></script>

<!-- CDN: React 18.3.1 UMD production builds (no dev warnings overhead) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

<!-- CDN: lightweight-charts (global window.LightweightCharts) -->
<script src="https://unpkg.com/lightweight-charts@4/dist/lightweight-charts.standalone.production.js" crossorigin="anonymous"></script>

<!--
  App loading — production bundle (A8 migration complete 2026-05-31):

  PATH A — Production: dist/app-bundle.js (esbuild-compiled, no eval)
    Build: node build.mjs   (using Playwright node binary or any Node ≥18)
    CSP: 'unsafe-eval' already removed from main.py SecurityHeadersMiddleware.
    TTI: <500 ms. Babel CDN (~900 KB) eliminated.

  PATH B — Dev fallback (localhost only): Babel CDN auto-activates on 404.
    load-app.js enforces localhost restriction — never fires in production.
-->
<!-- load-app.js: selects bundle (prod) vs Babel CDN (dev) — external to satisfy CSP -->
<script src="/load-app.js"></script>

<!--
  JSX files: only processed when Babel CDN loads (Path B).
  When Path A (bundle) succeeds, Babel is never loaded so these are ignored
  by the browser (unknown type="text/babel" is a no-op without Babel).
-->
<script type="text/babel" src="/src/app.auth.jsx?v=20260614"></script>
<script type="text/babel" src="/src/app.constants.jsx?v=20260614"></script>
<script type="text/babel" src="/src/cin.ui.jsx?v=20260614"></script>
<script type="text/babel" src="/src/cin.data.jsx?v=20260614"></script>
<script type="text/babel" src="/src/cin.market-data.jsx?v=20260614"></script>
<script type="text/babel" src="/src/cin.home.jsx?v=20260614"></script>
<script type="text/babel" src="/src/cin.dashboard.jsx?v=20260614"></script>

<script type="text/babel" src="/src/cin.backtest.jsx?v=20260614"></script>
<script type="text/babel" src="/src/cin.track.jsx?v=20260614"></script>
<script type="text/babel" src="/src/cin.settings.jsx?v=20260614"></script>
<script type="text/babel" src="/src/cin.app.jsx?v=20260614"></script>
</body>
</html>
