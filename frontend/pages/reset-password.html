<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="icon" type="image/png" href="/favicon.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0a0f1a"/>
<meta name="msapplication-TileColor" content="#0a0f1a"/>
<title>Reset Password — Signal.Trade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1a;--bg-0:#0a0f1a;--bg-1:#0e1420;--bg-2:#131a28;
  --line:#1f2a3d;--line2:#273348;--line-soft:rgba(255,255,255,0.04);
  --text:#e6edf7;--dim:#8a97ad;--faint:#7f8d9e;
  --up:#22d3ee;--down:#fb4d6d;--warn:#fbbf24;--accent:#22d3ee;
  --up-soft:rgba(34,211,238,.12);--down-soft:rgba(251,77,109,.12);
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',-apple-system,sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px}
.form-wrap{width:100%;max-width:420px}
.logo{margin-bottom:32px;text-align:center}
.logo img{height:80px;width:auto}
.form-section{background:var(--bg-1);border:1px solid var(--line);border-radius:14px;padding:28px}
.form-title{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px}
.form-sub{font-size:14px;color:var(--dim);margin-bottom:24px}
label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-bottom:6px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
input{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-size:14px;color:var(--text);outline:none;font-family:var(--sans);transition:border-color .15s;margin-bottom:14px}
input:focus{border-color:var(--up)}
input::placeholder{color:var(--faint)}
.pw-hint{font-size:11px;color:var(--faint);margin-top:-10px;margin-bottom:14px}
.submit-btn{width:100%;padding:13px;background:var(--up);color:#03121a;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:background .15s}
.submit-btn:hover{background:#3ee0f8}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.error-box{background:rgba(251,77,109,.1);border:1px solid rgba(251,77,109,.3);border-radius:7px;padding:10px 14px;font-size:13px;color:var(--down);margin-bottom:16px;display:none}
.success-box{background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);border-radius:7px;padding:14px;font-size:14px;color:var(--up);margin-bottom:16px;display:none}
.success-box a{color:var(--text);text-decoration:underline}
.form-footer{margin-top:24px;font-size:11px;color:var(--faint);text-align:center;line-height:1.7}
.form-footer a{color:var(--faint)}
.form-footer a:hover{color:var(--dim)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<div class="form-wrap">
  <div class="logo">
    <a href="/"><img src="/logo-full.svg" alt="Signal.Trade"/></a>
  </div>

  <div class="form-section">
    <h1 class="form-title">Reset password</h1>
    <p class="form-sub">Choose a new password for your account.</p>

    <div class="error-box" id="error"></div>
    <div class="success-box" id="success">
      Password reset successfully. <a href="/login">Sign in →</a>
    </div>

    <form id="reset-form">
      <div>
        <label for="password">New password</label>
        <input id="password" type="password" placeholder="At least 8 characters" required autocomplete="new-password"/>
        <div class="pw-hint">Use a strong password — we can't recover it if lost.</div>
      </div>
      <div>
        <label for="password2">Confirm new password</label>
        <input id="password2" type="password" placeholder="Re-enter password" required autocomplete="new-password"/>
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">Reset password</button>
    </form>
  </div>

  <div class="form-footer">
    ⚠️ Not financial advice · For informational purposes only · Trading involves risk of loss.
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const form = document.getElementById('reset-form');
const errorBox = document.getElementById('error');
const successBox = document.getElementById('success');
const submitBtn = document.getElementById('submit-btn');

if (!token) {
  errorBox.textContent = 'Invalid or missing reset token. Please request a new reset link.';
  errorBox.style.display = 'block';
  form.style.display = 'none';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  if (password.length < 8) {
    errorBox.textContent = 'Password must be at least 8 characters.';
    errorBox.style.display = 'block';
    return;
  }
  if (password !== password2) {
    errorBox.textContent = 'Passwords do not match.';
    errorBox.style.display = 'block';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Resetting…';

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: password }),
      credentials: 'include',
      signal: AbortSignal.timeout(10000),
    });
    const data = await res.json();
    if (!res.ok) {
      errorBox.textContent = data.detail || 'Could not reset password. The link may have expired.';
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset password';
      return;
    }
    form.style.display = 'none';
    successBox.style.display = 'block';
  } catch {
    errorBox.textContent = 'Network error. Please try again in a moment.';
    errorBox.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Reset password';
  }
});
</script>
</body>
</html>
